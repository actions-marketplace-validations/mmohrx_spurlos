<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Banner in einem Frame</title>
</head>
<body>
  <h1>Banner in einem Frame</h1>
  <p><a href="/impressum">Impressum</a> · <a href="/datenschutz">Datenschutz</a></p>
  <!-- some providers show their banner in a frame of their own server -->
  <iframe src="https://cdn.privacy-mgmt.com/banner.html" style="width: 600px; height: 200px; border: 0"></iframe>
  <!-- a chat in a frame of its own speaks of privacy too, but is no banner -->
  <iframe src="https://chat.example/widget.html" style="width: 300px; height: 200px; border: 0"></iframe>
</body>
</html>
