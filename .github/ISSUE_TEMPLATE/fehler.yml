name: Bug
description: spurlos reports something wrong, stops with an error or misses something.
labels: [fehler]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, what did you expect?
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: spurlos example.com --lang en
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Ideally from `--json`. Cut out whatever you would rather not share.
      render: text
  - type: input
    id: version
    attributes:
      label: Version and environment
      placeholder: spurlos 0.5.2, Node 24, macOS (or Docker)
