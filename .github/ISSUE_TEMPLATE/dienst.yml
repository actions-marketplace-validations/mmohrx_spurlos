name: Missing service
description: A host or cookie is reported as “unknown” although it belongs to a known service.
labels: [dienst]
body:
  - type: input
    id: name
    attributes:
      label: Service
      placeholder: Matomo
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Hosts, cookies or storage keys
      placeholder: |
        matomo.cloud
        Cookie _pk_id
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: The provider's documentation or another place that shows it.
  - type: markdown
    attributes:
      value: Even quicker is a pull request with one line in `src/services.json`, see CONTRIBUTING.md.
